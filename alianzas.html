<title>Alianzas Estratégicas - Psicología</title>

<style>

/* =========================
   CONFIGURACIÓN GENERAL
========================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f8f7fb;
  color: #30354a;
}

/* =========================
   CABECERA UNIVERSIDAD
========================= */

.uc-header {
  height: 82px;
  background: #ffffff;
  display: flex;
  align-items: center;
  padding: 0 28px;
  border-bottom: 1px solid #dddddd;
  gap: 22px;
}

.uc-header img {
  width: 205px;
  height: auto;
  object-fit: contain;
}

.uc-divider {
  width: 1px;
  height: 43px;
  background: #222;
}

.uc-modality {
  font-size: 20px;
  line-height: 1.1;
  color: #222;
}

.uc-modality span {
  display: block;
}

/* =========================
   BANNER PSICOLOGÍA
========================= */

.psychology-header {
  background: #7100d8;
  padding: 30px 28px 25px;
}

.psychology-header h1 {
  margin: 0;
  color: white;
  font-size: 58px;
  font-weight: 900;
  letter-spacing: -2px;
}

/* =========================
   ENCABEZADO ALIANZAS
========================= */

.alliances-header {
  text-align: center;
  padding: 48px 20px 25px;
}

.alliances-label {
  display: inline-block;
  background: #eee9f5;
  color: #654b83;
  padding: 9px 20px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.alliances-header h2 {
  margin: 20px 0 10px;
  font-size: 44px;
  color: #30354a;
}

.alliances-header p {
  max-width: 760px;
  margin: auto;
  color: #64708a;
  font-size: 17px;
  line-height: 1.6;
}

/* =========================
   FILTROS
========================= */

.filters {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 10px 20px 35px;
}

.filter-btn {
  border: none;
  background: #eeeaf5;
  color: #624a7e;
  padding: 12px 22px;
  border-radius: 25px;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
  transition: 0.2s;
}

.filter-btn:hover,
.filter-btn.active {
  background: #654b83;
  color: white;
}

/* =========================
   CONTENEDOR TARJETAS
========================= */

.cards-container {
  max-width: 1150px;
  margin: auto;
  padding: 0 25px 60px;

  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
}

/* =========================
   TARJETA
========================= */

.institution-card {
  background: white;
  border: 1px solid #ded8e8;
  border-radius: 25px;
  padding: 22px;
  position: relative;
  overflow: hidden;

  box-shadow: 0 5px 18px rgba(70, 45, 100, 0.06);

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.institution-card::after {
  content: "";
  position: absolute;
  width: 125px;
  height: 125px;
  right: -55px;
  top: -55px;
  background: #faf8fc;
  border-radius: 50%;
  z-index: 0;
}

.institution-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 25px rgba(70, 45, 100, 0.12);
}

.logo-box {
  width: 70px;
  height: 70px;
  border-radius: 18px;
  background: #f1edf7;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  z-index: 2;
  margin-bottom: 15px;
}

.logo-box img {
  max-width: 88%;
  max-height: 88%;
  object-fit: contain;
}

.institution-name {
  font-size: 20px;
  line-height: 1.25;
  margin: 0 0 12px;
  color: #273b5c;
  position: relative;
  z-index: 2;
}

.category {
  display: inline-block;
  background: #f5eff9;
  color: #694d83;
  border-radius: 18px;
  padding: 6px 12px;
  font-size: 12px;
  margin-bottom: 14px;
  position: relative;
  z-index: 2;
}

.info-line {
  margin: 9px 0;
  color: #65708a;
  font-size: 14px;
  line-height: 1.45;
  position: relative;
  z-index: 2;
}

.info-line strong {
  color: #30354a;
}

.more-btn {
  width: 100%;
  border: none;
  background: #654b83;
  color: white;
  padding: 12px;
  border-radius: 12px;
  margin-top: 13px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  position: relative;
  z-index: 2;
  transition: 0.2s;
}

.more-btn:hover {
  background: #513a6d;
}

/* =========================
   MODAL
========================= */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(31, 27, 40, 0.62);
  z-index: 9999;

  align-items: center;
  justify-content: center;

  padding: 20px;
}

.modal.show {
  display: flex;
}

.modal-content {
  width: min(680px, 100%);
  max-height: 90vh;
  overflow-y: auto;

  background: white;
  border-radius: 25px;
  padding: 30px;

  position: relative;

  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}

.close-modal {
  position: absolute;
  right: 20px;
  top: 18px;

  width: 35px;
  height: 35px;

  border: none;
  border-radius: 50%;

  background: #f0ebf5;
  color: #604779;

  font-size: 20px;
  cursor: pointer;
}

.modal-logo {
  width: 90px;
  height: 90px;
  background: #f2edf7;
  border-radius: 20px;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
  margin-bottom: 18px;
}

.modal-logo img {
  max-width: 90%;
  max-height: 90%;
  object-fit: contain;
}

.modal-content h3 {
  font-size: 28px;
  color: #30354a;
  margin: 0 45px 12px 0;
}

.modal-category {
  display: inline-block;
  background: #f1eaf7;
  color: #654b83;
  padding: 7px 13px;
  border-radius: 20px;
  font-size: 12px;
  margin-bottom: 22px;
}

.about-title {
  font-size: 17px;
  font-weight: bold;
  color: #30354a;
  margin-bottom: 8px;
}

.modal-description {
  color: #65708a;
  line-height: 1.65;
  font-size: 15px;
  margin-bottom: 22px;
}

.modal-info {
  background: #faf8fc;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 20px;
}

.modal-info p {
  margin: 8px 0;
  color: #59647c;
  font-size: 14px;
  line-height: 1.5;
}

.visit-btn {
  display: block;
  text-align: center;

  text-decoration: none;

  background: #654b83;
  color: white;

  padding: 13px 18px;
  border-radius: 12px;

  font-weight: bold;
}

.visit-btn:hover {
  background: #513a6d;
}

/* =========================
   SIN RESULTADOS
========================= */

.no-results {
  grid-column: 1 / -1;
  text-align: center;
  padding: 40px;
  color: #747c91;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 950px) {

  .cards-container {
    grid-template-columns: repeat(2, 1fr);
  }

}

@media (max-width: 650px) {

  .uc-header {
    height: auto;
    min-height: 75px;
    padding: 12px 18px;
    gap: 14px;
  }

  .uc-header img {
    width: 155px;
  }

  .uc-divider {
    height: 35px;
  }

  .uc-modality {
    font-size: 15px;
  }

  .psychology-header {
    padding: 25px 20px;
  }

  .psychology-header h1 {
    font-size: 42px;
  }

  .alliances-header h2 {
    font-size: 34px;
  }

  .alliances-header p {
    font-size: 15px;
  }

  .cards-container {
    grid-template-columns: 1fr;
    padding: 0 18px 40px;
  }

  .modal-content {
    padding: 23px;
  }

}

/* =========================
   ANIMACIÓN
========================= */

@keyframes aparecer {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.institution-card {
  animation: aparecer 0.35s ease;
}

</style>
</head>

/* =====================================================
   CREAR TARJETAS
===================================================== */

function mostrarInstituciones(lista) {

  const container =
    document.getElementById("cardsContainer");

  container.innerHTML = "";

  if (lista.length === 0) {

    container.innerHTML = `
      <div class="no-results">
        No se encontraron instituciones en esta categoría.
      </div>
    `;

    return;
  }

  lista.forEach((inst, index) => {

    const card =
      document.createElement("article");

    card.className = "institution-card";

    card.innerHTML = `

      <div class="logo-box">

        <img
          src="${inst.logo}"
          alt="${inst.nombre}"
          onerror="this.style.display='none';"
        >

      </div>

      <h3 class="institution-name">
        ${inst.nombre}
      </h3>

      <div class="category">
        ${inst.tipo}
      </div>

      <div class="info-line">
        📍 <strong>Ubicación:</strong>
        ${inst.ubicacion}
      </div>

      <div class="info-line">
        👥 <strong>Vacantes:</strong>
        ${inst.vacantes}
      </div>

      <div class="info-line">
        🏢 <strong>Dirección:</strong>
        ${inst.direccion}
      </div>

      <div class="info-line">
        🕘 <strong>Horario:</strong>
        ${inst.horario}
      </div>

      <button
        class="more-btn"
        onclick="abrirModal(${index})">
        Conocer más
      </button>

    `;

    container.appendChild(card);

  });

}


/* =====================================================
   FILTROS
===================================================== */

function filtrar(categoria, boton) {

  document
    .querySelectorAll(".filter-btn")
    .forEach(btn => {
      btn.classList.remove("active");
    });

  boton.classList.add("active");

  if (categoria === "todos") {

    mostrarInstituciones(instituciones);

  } else {

    const filtradas =
      instituciones.filter(
        inst => inst.categoria === categoria
      );

    mostrarInstituciones(filtradas);

  }

}


/* =====================================================
   ABRIR MODAL
===================================================== */

function abrirModal(index) {

  const inst =
    instituciones[index];

  document.getElementById("modalLogo").src =
    inst.logo;

  document.getElementById("modalLogo").alt =
    inst.nombre;

  document.getElementById("modalName").textContent =
    inst.nombre;

  document.getElementById("modalCategory").textContent =
    inst.tipo;

  document.getElementById("modalDescription").textContent =
    inst.descripcion;

  document.getElementById("modalLocation").innerHTML =
    `📍 <strong>Ubicación:</strong> ${inst.ubicacion}`;

  document.getElementById("modalAddress").innerHTML =
    `🏢 <strong>Dirección:</strong> ${inst.direccion}`;

  document.getElementById("modalPhone").innerHTML =
    `📞 <strong>Teléfono:</strong> ${inst.telefono}`;

  document.getElementById("modalEmail").innerHTML =
    `✉️ <strong>Correo:</strong> ${inst.email}`;

  document.getElementById("modalSchedule").innerHTML =
    `🕘 <strong>Horario:</strong> ${inst.horario}`;

  document.getElementById("modalLink").href =
    inst.enlace;

  document
    .getElementById("institutionModal")
    .classList.add("show");

}


/* =====================================================
   CERRAR MODAL
===================================================== */

function cerrarModal() {

  document
    .getElementById("institutionModal")
    .classList.remove("show");

}


/* =====================================================
   CERRAR AL HACER CLIC FUERA
===================================================== */

document
  .getElementById("institutionModal")
  .addEventListener("click", function(event) {

    if (event.target === this) {

      cerrarModal();

    }

  });


/* =====================================================
   CERRAR CON ESC
===================================================== */

document.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Escape") {

      cerrarModal();

    }

  }
);


/* =====================================================
   CARGAR INSTITUCIONES AL INICIAR
===================================================== */

mostrarInstituciones(instituciones);

</script>
