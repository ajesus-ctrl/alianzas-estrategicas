<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alianzas Estratégicas</title>

<style>

/* =========================================================
   ESTILOS GENERALES
========================================================= */

:root{
    --morado:#6f5a86;
    --morado-oscuro:#59466e;
    --morado-claro:#f1edf5;
    --borde:#ddd3e6;
    --texto:#403847;
    --gris:#746d7d;
    --blanco:#ffffff;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f7f5f8;
    color:var(--texto);
}


/* =========================================================
   ENCABEZADO
========================================================= */

header{
    background:#ffffff;
    border-bottom:1px solid var(--borde);
}

.header-inner{
    width:min(1200px,94%);
    min-height:85px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.brand-icon{
    width:52px;
    height:52px;

    border-radius:15px;

    background:var(--morado-claro);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:26px;
}

.brand h1{
    margin:0;

    font-size:24px;

    color:var(--morado-oscuro);
}

.brand p{
    margin:5px 0 0;

    font-size:14px;

    color:var(--gris);
}

.header-buttons{
    display:flex;
    gap:10px;
}

.header-buttons a{
    text-decoration:none;

    padding:12px 17px;

    border-radius:11px;

    font-weight:bold;
}

.btn-map{
    color:var(--morado-oscuro);

    background:var(--morado-claro);

    border:1px solid var(--borde);
}

.btn-home{
    color:white;

    background:var(--morado-oscuro);
}


/* =========================================================
   HERO
========================================================= */

.hero{
    text-align:center;

    padding:42px 20px 30px;
}

.hero h2{
    margin:0;

    color:var(--morado-oscuro);

    font-size:36px;
}

.hero > p{
    max-width:750px;

    margin:12px auto;

    color:var(--gris);

    line-height:1.6;
}

.map-box{
    width:min(850px,94%);

    margin:28px auto 0;

    padding:20px;

    background:white;

    border:1px solid var(--borde);

    border-radius:19px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

    text-align:left;
}

.map-box h3{
    margin:0;

    color:var(--morado-oscuro);
}

.map-box p{
    margin:7px 0 0;

    color:var(--gris);
}

.map-link{
    background:var(--morado-oscuro);

    color:white;

    text-decoration:none;

    padding:13px 18px;

    border-radius:11px;

    font-weight:bold;

    white-space:nowrap;
}


/* =========================================================
   CONTENEDOR
========================================================= */

.container{
    width:min(1200px,94%);

    margin:0 auto 50px;
}


/* =========================================================
   FILTROS
========================================================= */

.filters{
    display:grid;

    grid-template-columns:2fr 1fr 1fr auto;

    gap:12px;

    margin-bottom:20px;
}

.filters input,
.filters select,
.filters button{

    height:48px;

    border-radius:11px;

    border:1px solid var(--borde);

    padding:0 14px;

    font-size:14px;

}

.filters input,
.filters select{

    background:white;

    color:var(--texto);

}

.filters button{

    background:var(--morado-oscuro);

    color:white;

    cursor:pointer;

    font-weight:bold;

}


/* =========================================================
   CONTADOR
========================================================= */

.counter{

    margin:15px 0;

    color:var(--gris);

}

.counter strong{

    color:var(--morado-oscuro);

}


/* =========================================================
   TARJETAS
========================================================= */

.cards{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:18px;

}

.card{

    background:white;

    border:1px solid var(--borde);

    border-radius:20px;

    padding:20px;

    box-shadow:0 8px 24px rgba(70,50,90,.06);

}

.card-top{

    display:flex;

    align-items:center;

    gap:13px;

}

.logo{

    width:65px;

    height:65px;

    border-radius:15px;

    background:var(--morado-claro);

    border:1px solid var(--borde);

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    flex-shrink:0;

    color:var(--morado-oscuro);

    font-weight:bold;

    font-size:16px;

}

.logo img{

    width:100%;

    height:100%;

    object-fit:contain;

    padding:5px;

}

.card h3{

    margin:0;

    font-size:16px;

    line-height:1.4;

}


/* =========================================================
   ETIQUETAS
========================================================= */

.tags{

    display:flex;

    flex-wrap:wrap;

    gap:6px;

    margin:16px 0;

}

.tag{

    background:var(--morado-claro);

    border:1px solid #e6ddec;

    color:var(--morado);

    border-radius:20px;

    padding:6px 9px;

    font-size:12px;

}


/* =========================================================
   INFORMACIÓN
========================================================= */

.info{

    display:grid;

    gap:9px;

    color:var(--gris);

    font-size:13px;

    line-height:1.5;

}

.info strong{

    color:var(--texto);

}


/* =========================================================
   BOTÓN CONOCER MÁS
========================================================= */

.more{

    width:100%;

    margin-top:17px;

    border:0;

    background:var(--morado-oscuro);

    color:white;

    padding:12px;

    border-radius:10px;

    cursor:pointer;

    font-weight:bold;

}


/* =========================================================
   INFORMACIÓN ADICIONAL
========================================================= */

.details{

    display:none;

    margin-top:15px;

    padding-top:15px;

    border-top:1px solid var(--borde);

}

.details.open{

    display:block;

}

.review{

    background:var(--morado-claro);

    padding:14px;

    border-radius:13px;

}

.review h4{

    margin:0 0 8px;

    color:var(--morado-oscuro);

}

.review p{

    margin:0;

    color:var(--gris);

    font-size:13px;

    line-height:1.6;

}


/* =========================================================
   ENLACES
========================================================= */

.links-title{

    margin:15px 0 8px;

    color:var(--morado-oscuro);

    font-size:13px;

    font-weight:bold;

}

.links{

    display:flex;

    flex-wrap:wrap;

    gap:7px;

}

.link{

    text-decoration:none;

    color:var(--morado-oscuro);

    border:1px solid var(--borde);

    background:white;

    padding:7px 9px;

    border-radius:8px;

    font-size:12px;

    font-weight:bold;

}


/* =========================================================
   CONTACTO
========================================================= */

.contact{

    display:grid;

    gap:6px;

    color:var(--gris);

    font-size:12px;

    line-height:1.5;

}

.contact strong{

    color:var(--texto);

}


/* =========================================================
   SIN RESULTADOS
========================================================= */

.empty{

    grid-column:1/-1;

    background:white;

    padding:30px;

    border:1px solid var(--borde);

    border-radius:17px;

    text-align:center;

    color:var(--gris);

}


/* =========================================================
   PRÓXIMAMENTE
