/* =====================================================
   VARIABLES
===================================================== */

let data = [...fallbackData];

const $ = id => document.getElementById(id);


/* =====================================================
   ESCAPAR TEXTO
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================================
   LECTOR DE CSV
===================================================== */

function parseCSVLine(line){

  const result = [];

  let current = "";
  let insideQuotes = false;

  for(let i = 0; i < line.length; i++){

    const char = line[i];

    if(char === '"'){

      if(
        insideQuotes &&
        line[i + 1] === '"'
      ){

        current += '"';
        i++;

      }else{

        insideQuotes = !insideQuotes;

      }

    }

    else if(
      char === "," &&
      !insideQuotes
    ){

      result.push(current.trim());
      current = "";

    }

    else{

      current += char;

    }

  }

  result.push(current.trim());

  return result;

}


/* =====================================================
   CARGAR CSV
===================================================== */

async function loadCSV(){

  try{

    const response = await fetch(
      "alianzas.csv?nocache=" + Date.now(),
      {
        cache:"no-store"
      }
    );

    if(!response.ok){

      throw new Error("No se pudo cargar el CSV");

    }

    const text = await response.text();

    const lines = text
      .replace(/^\uFEFF/, "")
      .split(/\r?\n/)
      .filter(line => line.trim() !== "");

    if(lines.length < 2){

      throw new Error("El CSV está vacío");

    }

    const headers = parseCSVLine(lines[0])
      .map(header => header.trim());

    const parsedData = lines
      .slice(1)
      .map(line => {

        const values = parseCSVLine(line);

        const item = {};

        headers.forEach((header, index) => {

          item[header] = (
            values[index] || ""
          ).trim();

        });

        return item;

      })
      .filter(item => item.institucion);

    /* Solo reemplazamos los datos si realmente
       encontramos instituciones válidas */

    if(parsedData.length > 0){

      data = parsedData;

    }else{

      console.warn(
        "El CSV no contiene instituciones válidas. Se mantienen los datos de respaldo."
      );

    }

  }

  catch(error){

    console.warn(
      "No se pudo cargar el CSV. Se usan los datos de respaldo.",
      error
    );

  }

  populateFilters();
  render();

}


/* =====================================================
   LLENAR FILTROS
===================================================== */

function populateFilters(){

  const departments = [

    ...new Set(
      data
        .map(item => item.departamento)
        .filter(Boolean)
    )

  ].sort(
    (a,b) => a.localeCompare(b, "es")
  );


  const areas = [

    ...new Set(

      data.flatMap(item =>

        String(item.area || "")
          .split("/")
          .map(area => area.trim())
          .filter(Boolean)

      )

    )

  ].sort(
    (a,b) => a.localeCompare(b, "es")
  );


  $("d").innerHTML =
    `<option value="">Todos los departamentos</option>` +
    departments.map(department =>

      `<option value="${escapeHTML(department)}">
        ${escapeHTML(department)}
      </option>`

    ).join("");


  $("a").innerHTML =
    `<option value="">Todas las áreas</option>` +
    areas.map(area =>

      `<option value="${escapeHTML(area)}">
        ${escapeHTML(area)}
      </option>`

    ).join("");

}


/* =====================================================
   FILTRAR
===================================================== */

function filtered(){

  const query =
    $("q").value.trim().toLowerCase();

  const department =
    $("d").value;

  const area =
    $("a").value;


  return data.filter(item => {

    const searchable =
      Object.values(item)
        .join(" ")
        .toLowerCase();


    const matchesQuery =
      !query ||
      searchable.includes(query);


    const matchesDepartment =
      !department ||
      item.departamento === department;


    const itemAreas =
      String(item.area || "")
        .split("/")
        .map(value => value.trim());


    const matchesArea =
      !area ||
      itemAreas.includes(area);


    return (
      matchesQuery &&
      matchesDepartment &&
      matchesArea
    );

  });

}


/* =====================================================
   INICIALES
===================================================== */

function initials(name){

  return String(name || "")
    .split(/\s+/)
    .filter(Boolean)
    .slice(0,2)
    .map(word => word.charAt(0))
    .join("")
    .toUpperCase();

}


/* =====================================================
   RESEÑA AUTOMÁTICA
===================================================== */

function getReview(item){

  return `Institución ubicada en ${
    item.provincia_ciudad || item.departamento
  }. Ofrece oportunidades en el área ${
    item.area || "profesional"
  } y cuenta con ${
    item.vacantes || "vacantes por confirmar"
  } vacante${
    String(item.vacantes) === "1" ? "" : "s"
  } registradas en el directorio.`;

}


/* =====================================================
   RENDERIZAR TARJETAS
===================================================== */

function render(){

  const rows = filtered();


  $("count").textContent =
    `${rows.length} ${
      rows.length === 1
        ? "institución encontrada"
        : "instituciones encontradas"
    }`;


  if(!rows.length){

    $("cards").innerHTML = `
      <div class="empty">
        No encontramos instituciones
        con esos criterios de búsqueda.
      </div>
    `;

    return;

  }


  $("cards").innerHTML =
    rows.map((item, index) => {


      const areas =
        String(item.area || "")
          .split("/")
          .map(area => area.trim())
          .filter(Boolean);


      let logoHTML =
        escapeHTML(
          initials(item.institucion)
        );


      if(
        item.logo &&
        String(item.logo).trim() !== ""
      ){

        logoHTML = `
          <img
            src="${escapeHTML(item.logo)}"
            alt="${escapeHTML(item.institucion)}"
          >
        `;

      }


      const review = getReview(item);


      return `

        <article class="card">

          <div class="top">

            <div class="logo">
              ${logoHTML}
            </div>

            <div>
              <h3>
                ${escapeHTML(item.institucion)}
              </h3>
            </div>

          </div>


          <div class="tags">

            ${areas.map(area => `

              <span class="tag">
                ${escapeHTML(area)}
              </span>

            `).join("")}

          </div>


          <div class="info">

            <div>
              <strong>📍 Ubicación:</strong>
              ${escapeHTML(
                item.provincia_ciudad ||
                "No especificada"
              )},
              ${escapeHTML(
                item.departamento || ""
              )}
            </div>


            <div>
              <strong>👥 Vacantes:</strong>
              ${escapeHTML(
                item.vacantes ||
                "No especificado"
              )}
            </div>


            <div>
              <strong>🏢 Dirección:</strong>
              ${escapeHTML(
                item.direccion ||
                "No especificada"
              )}
            </div>


            <div>
              <strong>🕒 Horario:</strong>
              ${escapeHTML(
                item.horario ||
                "No especificado"
              )}
            </div>

          </div>


          <button
            class="more-button"
            data-extra="extra-${index}"
          >
            Conocer más
          </button>


          <div
            class="extra-info"
            id="extra-${index}"
          >

            <div class="review-box">

              <h4>
                Sobre la institución
              </h4>

              <p>
                ${escapeHTML(review)}
              </p>

            </div>

          </div>

        </article>

      `;

    }).join("");


  document
    .querySelectorAll(".more-button")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const extra =
            document.getElementById(
              button.dataset.extra
            );

          const isOpen =
            extra.classList.contains("open");


          extra.classList.toggle("open");


          button.textContent =
            isOpen
              ? "Conocer más"
              : "Ocultar información";

        }
      );

    });

}


/* =====================================================
   EVENTOS
===================================================== */

$("q").addEventListener(
  "input",
  render
);


$("d").addEventListener(
  "change",
  render
);


$("a").addEventListener(
  "change",
  render
);


$("clear").addEventListener(
  "click",
  () => {

    $("q").value = "";
    $("d").value = "";
    $("a").value = "";

    render();

  }
);


/* =====================================================
   INICIAR
===================================================== */

/* Primero mostramos inmediatamente las 18 instituciones */

populateFilters();
render();

/* Luego intentamos actualizar desde el CSV */

loadCSV();

</script>
